<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏐 Sistema de Voleibol - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-volleyball-ball"></i>
                </div>
                <h1>Sistema de Voleibol</h1>
                <p>Iniciar Sesión</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Usuario
                    </label>
                    <input type="text" id="username" name="username" required placeholder="" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" required placeholder="">
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>

                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorText"></span>
                </div>

                <div id="loginCooldownMessage" class="error-message" style="display: none; background: #fff3cd; color: #856404; border: 1px solid #ffe69c;">
                    <i class="fas fa-hourglass-half"></i>
                    <span id="loginCooldownText"></span>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        console.log('🔐 === LOGIN FINAL CARGADO ===');
        let loginCooldownUntil = 0;
        let loginCooldownInterval = null;
        let defaultSubmitButtonHtml = '';

        function clearError() {
            const errorDiv = document.getElementById('errorMessage');
            if (errorDiv) {
                errorDiv.style.display = 'none';
            }
        }

        function startLoginCooldown(totalSeconds) {
            const loginForm = document.getElementById('loginForm');
            const submitBtn = loginForm ? loginForm.querySelector('button[type="submit"]') : null;
            const cooldownWrap = document.getElementById('loginCooldownMessage');
            const cooldownText = document.getElementById('loginCooldownText');

            if (!submitBtn || !cooldownWrap || !cooldownText) return;

            clearError();

            const seconds = Math.max(1, Number(totalSeconds || 0));
            const nextUntil = Date.now() + (seconds * 1000);
            if (nextUntil > loginCooldownUntil) {
                loginCooldownUntil = nextUntil;
            }

            if (loginCooldownInterval) {
                clearInterval(loginCooldownInterval);
                loginCooldownInterval = null;
            }

            const tick = function() {
                const remaining = Math.max(0, Math.ceil((loginCooldownUntil - Date.now()) / 1000));
                if (remaining <= 0) {
                    cooldownWrap.style.display = 'none';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = defaultSubmitButtonHtml || '<i class="fas fa-sign-in-alt"></i> Iniciar Sesión';
                    if (loginCooldownInterval) {
                        clearInterval(loginCooldownInterval);
                        loginCooldownInterval = null;
                    }
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fas fa-hourglass-half"></i> Espera ${remaining}s`;
                cooldownText.textContent = `Debes esperar ${remaining} segundo${remaining === 1 ? '' : 's'} para volver a intentar iniciar sesión.`;
                cooldownWrap.style.display = 'flex';
            };

            tick();
            loginCooldownInterval = setInterval(tick, 1000);
        }
        
        async function attemptLogin(username, password) {
            console.log('🔐 Intentando login con Auth.login():', username);
            
            try {
                // Usar la nueva función Auth.login() (ahora es async)
                const result = await Auth.login(username, password);
                console.log('📊 Resultado de Auth.login():', result);
                
                if (result.success) {
                    console.log('✅ Login exitoso, redirigiendo...');
                    window.location.href = 'index.html';
                    return true;
                } else {
                    console.log('❌ Login fallido:', result.message);
                    if (result.retryAfterSeconds && result.retryAfterSeconds > 0) {
                        startLoginCooldown(result.retryAfterSeconds);
                    } else {
                        showError(result.message);
                    }
                    return false;
                }
            } catch (error) {
                console.error('❌ Error en attemptLogin:', error);
                showError('Error al intentar iniciar sesión');
                return false;
            }
        }


        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            if (errorDiv && errorText) {
                errorText.textContent = message;
                errorDiv.style.display = 'flex';
                
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Login DOM loaded');
            
            const loginForm = document.getElementById('loginForm');
            
            if (loginForm) {
                const submitBtnInit = loginForm.querySelector('button[type="submit"]');
                if (submitBtnInit) {
                    defaultSubmitButtonHtml = submitBtnInit.innerHTML;
                }

                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();

                    if (Date.now() < loginCooldownUntil) {
                        const remaining = Math.max(1, Math.ceil((loginCooldownUntil - Date.now()) / 1000));
                        startLoginCooldown(remaining);
                        return;
                    }
                    
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;
                    
                    // Mostrar indicador de carga
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
                    submitBtn.disabled = true;
                    
                    try {
                        await attemptLogin(username, password);
                    } catch (error) {
                        console.error('Error en login:', error);
                        showError('Error al iniciar sesión');
                    } finally {
                        // Restaurar botón
                        if (Date.now() >= loginCooldownUntil) {
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
