<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏐 Sistema de Voleibol - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-volleyball-ball"></i>
                </div>
                <h1>Sistema de Voleibol</h1>
                <p>Iniciar Sesión</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Usuario
                    </label>
                    <input type="text" id="username" name="username" required placeholder="" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" required placeholder="">
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>

                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorText"></span>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== MODAL CONTRASEÑA TEMPORAL (primer login) ===== -->
    <div id="modal-primer-login-pwd" style="display:none; position:fixed; inset:0; z-index:99999; align-items:center; justify-content:center; backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); background:rgba(0,0,0,0.52);">
        <div style="background:#fff; border-radius:16px; padding:36px 40px; max-width:440px; width:90%; box-shadow:0 12px 48px rgba(0,0,0,0.22); animation:pwdModalIn .2s ease;">
            <div style="text-align:center; margin-bottom:22px;">
                <div style="font-size:3rem; margin-bottom:8px; line-height:1;">&#128273;</div>
                <h3 style="margin:0 0 8px 0; font-size:1.3rem; color:#1a1a2e;">Establece tu contraseña</h3>
                <p style="color:#666; margin:0; font-size:0.93rem; line-height:1.55;">Tu contraseña actual es temporal.<br>Puedes cambiarla ahora o hacerlo más tarde desde la app.</p>
            </div>
            <div style="margin-bottom:14px;">
                <label style="display:block; font-weight:600; margin-bottom:6px; font-size:0.9rem; color:#333;">Nueva contraseña</label>
                <input type="password" id="primer-pwd-new" placeholder="Mínimo 4 caracteres" autocomplete="new-password"
                       style="width:100%; padding:11px 13px; border:1.5px solid #ddd; border-radius:8px; font-size:1rem; box-sizing:border-box; outline:none; transition:border-color .15s;"
                       onfocus="this.style.borderColor='#0d6efd'" onblur="this.style.borderColor='#ddd'">
            </div>
            <div style="margin-bottom:20px;">
                <label style="display:block; font-weight:600; margin-bottom:6px; font-size:0.9rem; color:#333;">Repetir contraseña</label>
                <input type="password" id="primer-pwd-confirm" placeholder="Repite la contraseña" autocomplete="new-password"
                       style="width:100%; padding:11px 13px; border:1.5px solid #ddd; border-radius:8px; font-size:1rem; box-sizing:border-box; outline:none; transition:border-color .15s;"
                       onfocus="this.style.borderColor='#0d6efd'" onblur="this.style.borderColor='#ddd'">
            </div>
            <div id="primer-pwd-error" style="display:none; color:#dc3545; margin-bottom:16px; font-size:0.9rem; background:#fff0f0; padding:9px 13px; border-radius:7px; border:1px solid #f5c6cb;"></div>
            <div style="display:flex; gap:10px;">
                <button id="primer-pwd-skip" type="button"
                        style="flex:1; padding:12px; background:#f0f0f0; border:none; border-radius:8px; cursor:pointer; font-size:0.95rem; color:#555; font-weight:500;">
                    Más tarde
                </button>
                <button id="primer-pwd-submit" type="button"
                        style="flex:2; padding:12px; background:linear-gradient(135deg,#0d6efd,#0a58ca); color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:1rem; font-weight:600; box-shadow:0 2px 8px rgba(13,110,253,.35);">
                    Guardar contraseña
                </button>
            </div>
        </div>
    </div>

    <style>
    @keyframes pwdModalIn {
        from { opacity:0; transform:scale(.94) translateY(-12px); }
        to   { opacity:1; transform:scale(1)  translateY(0); }
    }
    </style>

    <script src="auth.js"></script>
    <script>
        console.log('🔐 === LOGIN FINAL CARGADO ===');
        
        async function attemptLogin(username, password) {
            console.log('🔐 Intentando login con Auth.login():', username);
            
            try {
                // Usar la nueva función Auth.login() (ahora es async)
                const result = await Auth.login(username, password);
                console.log('📊 Resultado de Auth.login():', result);
                
                if (result.success) {
                    if (result.user && result.user.mustChangePassword) {
                        await showFirstLoginPasswordModal();
                    }

                    console.log('✅ Login exitoso, redirigiendo...');
                    window.location.href = 'index.html';
                    return true;
                } else {
                    console.log('❌ Login fallido:', result.message);
                    showError(result.message);
                    return false;
                }
            } catch (error) {
                console.error('❌ Error en attemptLogin:', error);
                showError('Error al intentar iniciar sesión');
                return false;
            }
        }

        async function showFirstLoginPasswordModal() {
            return new Promise(function(resolve) {
                var modal        = document.getElementById('modal-primer-login-pwd');
                var newInput     = document.getElementById('primer-pwd-new');
                var confirmInput = document.getElementById('primer-pwd-confirm');
                var errorDiv     = document.getElementById('primer-pwd-error');
                var submitBtn    = document.getElementById('primer-pwd-submit');
                var skipBtn      = document.getElementById('primer-pwd-skip');

                newInput.value     = '';
                confirmInput.value = '';
                errorDiv.style.display = 'none';
                submitBtn.disabled     = false;
                submitBtn.textContent  = 'Guardar contraseña';

                modal.style.display = 'flex';
                setTimeout(function() { newInput.focus(); }, 80);

                function cleanup() {
                    modal.style.display = 'none';
                    submitBtn.removeEventListener('click', onSubmit);
                    skipBtn.removeEventListener('click', onSkip);
                    [newInput, confirmInput].forEach(function(el) { el.removeEventListener('keydown', onEnter); });
                }
                function showErr(msg) {
                    errorDiv.textContent   = msg;
                    errorDiv.style.display = 'block';
                }
                async function onSubmit() {
                    var newPwd     = newInput.value;
                    var confirmPwd = confirmInput.value;
                    errorDiv.style.display = 'none';
                    if (!newPwd || newPwd.length < 4) { showErr('La contraseña debe tener al menos 4 caracteres.'); return; }
                    if (newPwd !== confirmPwd)        { showErr('Las contraseñas no coinciden.'); return; }
                    submitBtn.disabled    = true;
                    submitBtn.textContent = 'Guardando…';
                    try {
                        var API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                            ? 'http://localhost:3000/api'
                            : window.location.origin + '/api';
                        var token = localStorage.getItem('volleyball_token') || '';
                        var res = await fetch(API_URL + '/users/change-password', {
                            method : 'POST',
                            headers: Object.assign({'Content-Type':'application/json'},
                                                   token ? {'Authorization':'Bearer '+token} : {}),
                            body   : JSON.stringify({ newPassword: newPwd })
                        });
                        var payload = await res.json().catch(function() { return {}; });
                        if (!res.ok) throw new Error(payload.error || ('HTTP ' + res.status));
                        // Actualizar sesión local
                        try {
                            ['localStorage','sessionStorage'].forEach(function(s) {
                                var raw = window[s].getItem('volleyball_auth');
                                if (!raw) return;
                                var sess = JSON.parse(raw);
                                sess.mustChangePassword = false;
                                window[s].setItem('volleyball_auth', JSON.stringify(sess));
                            });
                        } catch(e) {}
                        cleanup();
                        resolve(true);
                    } catch (err) {
                        submitBtn.disabled    = false;
                        submitBtn.textContent = 'Guardar contraseña';
                        showErr(err.message || 'No se pudo cambiar la contraseña.');
                    }
                }
                function onSkip()  { cleanup(); resolve(false); }
                function onEnter(e) { if (e.key === 'Enter') { e.preventDefault(); onSubmit(); } }
                submitBtn.addEventListener('click', onSubmit);
                skipBtn.addEventListener('click', onSkip);
                [newInput, confirmInput].forEach(function(el) { el.addEventListener('keydown', onEnter); });
            });
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            if (errorDiv && errorText) {
                errorText.textContent = message;
                errorDiv.style.display = 'flex';
                
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Login DOM loaded');
            
            const loginForm = document.getElementById('loginForm');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;
                    
                    // Mostrar indicador de carga
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
                    submitBtn.disabled = true;
                    
                    try {
                        await attemptLogin(username, password);
                    } catch (error) {
                        console.error('Error en login:', error);
                        showError('Error al iniciar sesión');
                    } finally {
                        // Restaurar botón
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
