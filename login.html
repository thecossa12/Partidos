<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏐 Sistema de Voleibol - Login</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏐</text></svg>">
    <link rel="stylesheet" href="login.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">
                    <i class="fas fa-volleyball-ball"></i>
                </div>
                <h1>Sistema de Voleibol</h1>
                <p>Iniciar Sesión</p>
            </div>

            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username">
                        <i class="fas fa-user"></i>
                        Usuario
                    </label>
                    <input type="text" id="username" name="username" required placeholder="" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Contraseña
                    </label>
                    <input type="password" id="password" name="password" required placeholder="">
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i>
                    Iniciar Sesión
                </button>

                <div id="errorMessage" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span id="errorText"></span>
                </div>
            </form>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        console.log('🔐 === LOGIN FINAL CARGADO ===');
        
        async function attemptLogin(username, password) {
            console.log('🔐 Intentando login con Auth.login():', username);
            
            try {
                // Usar la nueva función Auth.login() (ahora es async)
                const result = await Auth.login(username, password);
                console.log('📊 Resultado de Auth.login():', result);
                
                if (result.success) {
                    if (result.user && result.user.mustChangePassword) {
                        const wantsToChangeNow = confirm('🔐 Tu contraseña actual es temporal. ¿Quieres cambiarla ahora?\n\nPulsa "Aceptar" para cambiarla ahora o "Cancelar" para hacerlo más tarde.');

                        if (wantsToChangeNow) {
                            const changed = await changePasswordFirstLogin();
                            if (!changed) {
                                return false;
                            }
                        }
                    }

                    console.log('✅ Login exitoso, redirigiendo...');
                    window.location.href = 'index.html';
                    return true;
                } else {
                    console.log('❌ Login fallido:', result.message);
                    showError(result.message);
                    return false;
                }
            } catch (error) {
                console.error('❌ Error en attemptLogin:', error);
                showError('Error al intentar iniciar sesión');
                return false;
            }
        }

        async function changePasswordFirstLogin() {
            const newPassword = prompt('Introduce la nueva contraseña (mínimo 8 caracteres):');
            if (newPassword === null || newPassword === '') {
                showError('Cambio de contraseña cancelado. Puedes hacerlo después desde la app.');
                return false;
            }

            if (newPassword.length < 8) {
                showError('La nueva contraseña debe tener al menos 8 caracteres.');
                return false;
            }

            const confirmPassword = prompt('Repite la nueva contraseña:');
            if (confirmPassword === null || confirmPassword === '') {
                showError('Cambio de contraseña cancelado. Puedes hacerlo después desde la app.');
                return false;
            }

            if (newPassword !== confirmPassword) {
                showError('Las contraseñas no coinciden.');
                return false;
            }

            try {
                const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
                    ? 'http://localhost:3000/api'
                    : window.location.origin + '/api';
                const token = localStorage.getItem('volleyball_token') || '';

                const response = await fetch(`${API_URL}/users/change-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({ newPassword })
                });

                const payload = await response.json().catch(() => ({}));

                if (!response.ok) {
                    throw new Error(payload.error || `HTTP ${response.status}`);
                }

                // Actualizar sesión local para no volver a mostrar recordatorio.
                try {
                    const sessionRaw = localStorage.getItem('volleyball_auth');
                    if (sessionRaw) {
                        const session = JSON.parse(sessionRaw);
                        session.mustChangePassword = false;
                        localStorage.setItem('volleyball_auth', JSON.stringify(session));
                        sessionStorage.setItem('volleyball_auth', JSON.stringify(session));
                    }
                } catch (error) {
                    console.warn('⚠️ No se pudo actualizar el estado local de sesión:', error.message);
                }

                return true;
            } catch (error) {
                console.error('❌ Error cambiando contraseña en primer login:', error);
                showError(`No se pudo cambiar la contraseña: ${error.message}`);
                return false;
            }
        }
        
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            if (errorDiv && errorText) {
                errorText.textContent = message;
                errorDiv.style.display = 'flex';
                
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 Login DOM loaded');
            
            const loginForm = document.getElementById('loginForm');
            
            if (loginForm) {
                loginForm.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    
                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;
                    
                    // Mostrar indicador de carga
                    const submitBtn = loginForm.querySelector('button[type="submit"]');
                    const originalText = submitBtn.innerHTML;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
                    submitBtn.disabled = true;
                    
                    try {
                        await attemptLogin(username, password);
                    } catch (error) {
                        console.error('Error en login:', error);
                        showError('Error al iniciar sesión');
                    } finally {
                        // Restaurar botón
                        submitBtn.innerHTML = originalText;
                        submitBtn.disabled = false;
                    }
                });
            }
        });
    </script>
</body>
</html>
